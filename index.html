<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제주도 여행 — 5.23~25</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1B7FAD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="제주여행">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231B7FAD'/%3E%3Ctext x='90' y='115' text-anchor='middle' font-size='90' fill='white'%3E🏝️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ocean: #1B7FAD;
  --ocean-light: #E8F4F8;
  --ocean-deep: #0E5A7E;
  --barley: #6BAF6B;
  --barley-light: #E8F5E8;
  --barley-deep: #4A8A4A;
  --coral: #E8785A;
  --coral-light: #FFF0EB;
  --coral-deep: #C45E3F;
  --volcanic: #4A4A4A;
  --volcanic-light: #8A8A8A;
  --sand: #F7F3EE;
  --sand-warm: #EDE6DB;
  --linen: #FAF8F5;
  --white: #FFFFFF;
  --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 16px;
  --radius-sm: 10px;
}

html, body {
  height: 100%;
  font-family: 'Pretendard', -apple-system, sans-serif;
  color: var(--volcanic);
  background: var(--linen);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* — Linen texture overlay — */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='60' height='60' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* — Header — */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: linear-gradient(135deg, var(--white) 0%, var(--sand) 100%);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 20px 0;
}

.title-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}

.title {
  font-family: 'Noto Serif KR', serif;
  font-weight: 900;
  font-size: 22px;
  color: var(--volcanic);
  letter-spacing: -0.5px;
}

.title-accent {
  color: var(--ocean);
}

.subtitle {
  font-size: 13px;
  color: var(--volcanic-light);
  font-weight: 400;
}

/* — Day Tabs — */
.tabs {
  display: flex;
  gap: 4px;
}

.tab {
  position: relative;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  color: var(--volcanic-light);
  background: transparent;
  border: none;
  border-radius: 10px 10px 0 0;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}

.tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.tab:hover { color: var(--volcanic); background: rgba(0,0,0,0.03); }

.tab.active { color: var(--volcanic); background: rgba(0,0,0,0.04); }
.tab.active::after { width: 70%; }

.tab[data-day="1"].active { color: var(--coral-deep); }
.tab[data-day="1"].active::after { background: var(--coral); }
.tab[data-day="2"].active { color: var(--ocean-deep); }
.tab[data-day="2"].active::after { background: var(--ocean); }
.tab[data-day="3"].active { color: var(--barley-deep); }
.tab[data-day="3"].active::after { background: var(--barley); }
.tab[data-day="all"].active { color: var(--volcanic); }
.tab[data-day="all"].active::after { background: var(--volcanic); }

.tab .tab-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.tab[data-day="1"] .tab-dot { background: var(--coral); }
.tab[data-day="2"] .tab-dot { background: var(--ocean); }
.tab[data-day="3"] .tab-dot { background: var(--barley); }

/* — Main Layout — */
.main {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding-top: 88px;
}

/* — Map — */
.map-container {
  position: relative;
  flex: 0 0 55%;
  min-height: 250px;
}

#map {
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Custom Leaflet overrides */
.leaflet-popup-content-wrapper {
  border-radius: 14px !important;
  box-shadow: var(--shadow-card) !important;
  font-family: 'Pretendard', sans-serif !important;
  padding: 0 !important;
  overflow: hidden;
}
.leaflet-popup-content {
  margin: 0 !important;
  min-width: 200px;
}
.leaflet-popup-tip {
  box-shadow: var(--shadow-soft) !important;
}

.popup-inner {
  padding: 14px 16px;
}
.popup-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  color: white;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.popup-name {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.popup-time {
  font-size: 12px;
  color: var(--volcanic-light);
  margin-bottom: 4px;
}
.popup-memo {
  font-size: 12px;
  color: var(--volcanic-light);
  line-height: 1.4;
}
.popup-tip {
  font-size: 11px;
  color: var(--ocean-deep);
  background: var(--ocean-light);
  padding: 4px 8px;
  border-radius: 6px;
  margin-top: 6px;
  line-height: 1.4;
}
.popup-alts {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(0,0,0,0.06);
}
.popup-alts-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--volcanic-light);
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.popup-alt {
  margin-bottom: 4px;
}
.popup-alt a {
  font-size: 12px;
  font-weight: 600;
  color: var(--ocean);
  text-decoration: none;
}
.popup-alt a:hover { text-decoration: underline; }
.popup-alt-desc {
  font-size: 10px;
  color: var(--volcanic-light);
  margin-left: 2px;
}
.popup-links {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.popup-link {
  display: inline-block;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--sand);
  color: var(--ocean-deep);
  text-decoration: none;
  font-weight: 500;
  transition: background 0.2s;
}
.popup-link:hover { background: var(--ocean-light); }

/* Custom numbered markers */
.custom-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  border: 2.5px solid white;
  font-family: 'Pretendard', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: white;
  transition: transform 0.2s ease;
}
.custom-marker span {
  transform: rotate(45deg);
}
.custom-marker.day1 { background: var(--coral); }
.custom-marker.day2 { background: var(--ocean); }
.custom-marker.day3 { background: var(--barley); }

.custom-marker.active-marker {
  transform: rotate(-45deg) scale(1.3);
  z-index: 9999 !important;
}

/* Ferry icon marker */
.ferry-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--ocean);
  box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  border: 2px solid white;
  font-size: 14px;
}

/* — Timeline Panel — */
.timeline-panel {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--white);
  border-top: 1px solid rgba(0,0,0,0.06);
  position: relative;
}

.timeline-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 20px;
  background: linear-gradient(to bottom, rgba(255,255,255,1), rgba(255,255,255,0));
  z-index: 10;
  pointer-events: none;
}

.timeline-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 100px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.timeline-scroll::-webkit-scrollbar { width: 4px; }
.timeline-scroll::-webkit-scrollbar-track { background: transparent; }
.timeline-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

/* Day divider */
.day-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0 12px;
  padding: 0 4px;
}

.day-divider-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.day-divider-text {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
}

.day-divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, rgba(0,0,0,0.1), transparent);
}

.day-divider.day1 .day-divider-dot { background: var(--coral); }
.day-divider.day1 .day-divider-text { color: var(--coral-deep); }
.day-divider.day2 .day-divider-dot { background: var(--ocean); }
.day-divider.day2 .day-divider-text { color: var(--ocean-deep); }
.day-divider.day3 .day-divider-dot { background: var(--barley); }
.day-divider.day3 .day-divider-text { color: var(--barley-deep); }

/* Timeline cards */
.tl-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  border: 1.5px solid transparent;
}

.tl-card:hover {
  background: var(--sand);
  border-color: rgba(0,0,0,0.04);
}

.tl-card.active-card {
  background: var(--sand);
  border-color: rgba(0,0,0,0.08);
  box-shadow: var(--shadow-soft);
}

.tl-card.day1.active-card { border-left: 3px solid var(--coral); }
.tl-card.day2.active-card { border-left: 3px solid var(--ocean); }
.tl-card.day3.active-card { border-left: 3px solid var(--barley); }

/* Now indicator */
.tl-card.is-now::before {
  content: '지금';
  position: absolute;
  top: -6px;
  right: 12px;
  background: #FF4444;
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  animation: pulse-now 2s ease-in-out infinite;
}

@keyframes pulse-now {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.tl-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.tl-card.day1 .tl-icon { background: var(--coral-light); }
.tl-card.day2 .tl-icon { background: var(--ocean-light); }
.tl-card.day3 .tl-icon { background: var(--barley-light); }

.tl-content {
  flex: 1;
  min-width: 0;
  overflow: visible;
}

.tl-time {
  font-size: 11px;
  font-weight: 600;
  color: var(--volcanic-light);
  margin-bottom: 2px;
  letter-spacing: 0.3px;
}

.tl-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--volcanic);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tl-memo {
  font-size: 12px;
  color: var(--volcanic-light);
  line-height: 1.3;
}

.tl-tip {
  font-size: 11px;
  color: var(--ocean-deep);
  background: var(--ocean-light);
  padding: 3px 8px;
  border-radius: 6px;
  margin-top: 4px;
  display: inline-block;
  line-height: 1.3;
}
.tl-alts-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--volcanic-light);
  margin-top: 8px;
  margin-bottom: 4px;
}
.tl-alts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tl-alt-chip {
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 8px;
  background: var(--coral-light);
  color: var(--coral-deep);
  text-decoration: none;
  font-weight: 600;
  border: 1px solid rgba(232,120,90,0.3);
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.tl-alt-chip:hover, .tl-alt-chip:active { background: var(--coral); color: white; }
.tl-links-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--volcanic-light);
  margin-top: 8px;
  margin-bottom: 4px;
}
.tl-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tl-link {
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 8px;
  background: var(--ocean-light);
  color: var(--ocean-deep);
  text-decoration: none;
  font-weight: 600;
  border: 1px solid rgba(27,127,173,0.25);
  transition: all 0.2s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.tl-link:hover, .tl-link:active { background: var(--ocean); color: white; }

.tl-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.tl-card.day1 .tl-num { background: var(--coral); }
.tl-card.day2 .tl-num { background: var(--ocean); }
.tl-card.day3 .tl-num { background: var(--barley); }

/* — Resize Handle — */
.resize-handle {
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: ns-resize;
  background: var(--white);
  border-top: 1px solid rgba(0,0,0,0.06);
  touch-action: none;
  flex-shrink: 0;
  z-index: 100;
}

.resize-handle-bar {
  width: 40px;
  height: 4px;
  border-radius: 4px;
  background: rgba(0,0,0,0.12);
}

/* — Ferry info badge — */
.ferry-info {
  background: var(--ocean-light);
  border: 1px solid rgba(27,127,173,0.15);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 4px 0 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ocean-deep);
}

.ferry-info strong { font-weight: 600; }

/* — Desktop Layout — */
@media (min-width: 768px) {
  .main {
    flex-direction: row;
    padding-top: 88px;
  }

  .map-container {
    flex: 0 0 58%;
    height: auto;
  }

  .resize-handle { display: none; }

  .timeline-panel {
    flex: 1;
    border-top: none;
    border-left: 1px solid rgba(0,0,0,0.06);
  }

  .timeline-scroll {
    padding: 20px 20px 100px;
  }

  .tl-card {
    padding: 14px 16px;
    margin-bottom: 4px;
  }

  .header-inner {
    padding: 14px 28px 0;
  }

  .title { font-size: 24px; }
}

@media (min-width: 1200px) {
  .map-container { flex: 0 0 62%; }
}

/* — Loading animation — */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--linen);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  transition: opacity 0.5s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-text {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--volcanic);
  margin-bottom: 8px;
}

.loading-sub {
  font-size: 13px;
  color: var(--volcanic-light);
}

.loading-dots span {
  display: inline-block;
  animation: dot-bounce 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
  0%, 80%, 100% { opacity: 0.3; }
  40% { opacity: 1; }
}

/* — Checklist panel — */
.checklist-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--volcanic);
  color: white;
  border: none;
  font-size: 20px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  z-index: 1001;
  transition: transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.checklist-toggle:hover { transform: scale(1.1); }

.checklist-drawer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.12);
  z-index: 1002;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  max-height: 60vh;
  overflow-y: auto;
  padding: 20px 24px 40px;
}

.checklist-drawer.open { transform: translateY(0); }

.checklist-drawer h3 {
  font-family: 'Noto Serif KR', serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}

.check-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--ocean);
  cursor: pointer;
}

.check-item.checked label {
  text-decoration: line-through;
  color: var(--volcanic-light);
}

.checklist-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.checklist-overlay.open {
  opacity: 1;
  pointer-events: all;
}

/* — Nav button (길찾기) — */
.tl-nav-row {
  margin-top: 8px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tl-nav-btn {
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}
.tl-nav-naver {
  background: #03C75A;
  color: white;
}
.tl-nav-naver:active { background: #02a34a; }
.tl-nav-kakao {
  background: #FEE500;
  color: #191919;
}
.tl-nav-kakao:active { background: #e6cf00; }

/* — PlanB badge — */
.tl-planb-label {
  font-size: 11px;
  font-weight: 700;
  color: #E67E22;
  margin-top: 8px;
  margin-bottom: 4px;
}
.tl-planb {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tl-planb-chip {
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 8px;
  background: #FFF3E0;
  color: #E67E22;
  font-weight: 600;
  border: 1px solid rgba(230,126,34,0.3);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s;
}
.tl-planb-chip:active { background: #E67E22; color: white; }

/* — Hours / Closed warning — */
.tl-hours {

  bottom: 76px;

}

}

body.rain-mode .tl-card[data-indoor="false"]:not([data-has-planb="true"]) {

  background: #FFF3E0;
  border-radius: 8px;
  padding: 6px 8px;

}
@keyframes planb-highlight {

  50% { box-shadow: 0 0 0 4px rgba(230,126,34,0.15); }
}

function createMarkerIcon(day, num) {
  const color = DAY_COLORS[day].main;
  return L.divIcon({
    className: '',
    html: `<div class="custom-marker day${day}"><span>${num}</span></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -34],
  });
}

// Create markers
PLACES.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon: createMarkerIcon(p.day, p.num) });

  const badgeColor = DAY_COLORS[p.day].main;
  let popupExtra = '';
  if (p.tip) {
    popupExtra += `<div class="popup-tip">💡 ${p.tip}</div>`;
  }
  if (p.alts && p.alts.length) {
    popupExtra += `<div class="popup-alts"><div class="popup-alts-title">🍽️ 추천 맛집</div>`;
    p.alts.forEach(a => {
      popupExtra += `<div class="popup-alt"><a href="${a.url}" target="_blank">${a.name}</a> <span class="popup-alt-desc">${a.desc}</span></div>`;
    });
    popupExtra += `</div>`;
  }
  if (p.links && p.links.length) {
    popupExtra += `<div class="popup-links">`;
    p.links.forEach(l => {
      popupExtra += `<a class="popup-link" href="${l.url}" target="_blank">🔗 ${l.label}</a>`;
    });
    popupExtra += `</div>`;
  }
  const naverUrl = `nmap://search?query=${encodeURIComponent(p.name)}&lat=${p.lat}&lng=${p.lng}&appname=jeju.trip`;
  const naverWeb = `https://map.naver.com/v5/search/${encodeURIComponent(p.name + ' 제주')}`;
  const kakaoUrl = `https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${p.lat},${p.lng}`;
  const popupNav = `<div class="popup-nav-row">
    <a class="popup-nav-btn tl-nav-naver" href="${naverWeb}" target="_blank">네이버지도</a>
    <a class="popup-nav-btn tl-nav-kakao" href="${kakaoUrl}" target="_blank">카카오맵</a>
  </div>`;
  const popupHtml = `
    <div class="popup-inner">
      <div class="popup-badge" style="background:${badgeColor}">DAY ${p.day}</div>
      <div class="popup-name">${p.icon} ${p.name}</div>
      <div class="popup-time">${p.time}</div>
      <div class="popup-memo">${p.memo}</div>
      ${popupExtra}
      ${popupNav}
    </div>
  `;
  marker.bindPopup(popupHtml, { closeButton: false, offset: [0, -4], maxWidth: 300 });

  markers[p.id] = marker;
  dayGroups[p.day].push(marker);
});

// Create polylines per day
function buildPolylines() {
  [1, 2, 3].forEach(day => {
    const pts = PLACES.filter(p => p.day === day);
    const coords = pts.map(p => [p.lat, p.lng]);
    const color = DAY_COLORS[day].main;

    // Check for ferry segments (day 2 has ferry to Gapado)
    const segments = [];
    let currentSeg = { coords: [], dash: false };

    for (let i = 0; i < pts.length; i++) {
      const isFerry = pts[i].cat === 'ferry' || pts[i].cat === 'island';
      const nextIsFerry = pts[i + 1] && (pts[i + 1].cat === 'ferry' || pts[i + 1].cat === 'island');

      currentSeg.coords.push([pts[i].lat, pts[i].lng]);

      if (i < pts.length - 1) {
        const segIsFerry = isFerry || nextIsFerry;
        if (segIsFerry !== currentSeg.dash && currentSeg.coords.length > 0) {
          segments.push({ ...currentSeg });
          currentSeg = { coords: [[pts[i].lat, pts[i].lng]], dash: segIsFerry };
        } else {
          currentSeg.dash = segIsFerry;
        }
      }
    }
    if (currentSeg.coords.length > 0) segments.push(currentSeg);

    const lines = segments.map(seg =>
      L.polyline(seg.coords, {
        color: color,
        weight: 3,
        opacity: seg.dash ? 0.5 : 0.7,
        dashArray: seg.dash ? '8, 8' : null,
        lineJoin: 'round',
        lineCap: 'round',
      })
    );

    polylines[day] = lines;
  });
}

buildPolylines();

// ─── DAY FILTERING ────────────────────────────
let activeDay = 'all';
const allLayers = L.layerGroup();

function showDay(day) {
  activeDay = day;

  // Clear map
  map.eachLayer(l => {
    if (l instanceof L.Marker || l instanceof L.Polyline) map.removeLayer(l);
  });

  const daysToShow = day === 'all' ? [1, 2, 3] : [parseInt(day)];

  daysToShow.forEach(d => {
    dayGroups[d].forEach(m => m.addTo(map));
    polylines[d].forEach(l => l.addTo(map));
  });

  // Fit bounds
  const visiblePlaces = PLACES.filter(p => daysToShow.includes(p.day));
  if (visiblePlaces.length > 0) {
    const bounds = L.latLngBounds(visiblePlaces.map(p => [p.lat, p.lng]));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
  }

  // Update timeline
  renderTimeline(daysToShow);

  // Update tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.day === day);
  });
}

// ─── TIMELINE RENDERING ──────────────────────
function getNowId() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate(), h = now.getHours(), min = now.getMinutes();

  if (y !== 2026 || m !== 5 || d < 23 || d > 25) return null;

  const day = d - 22; // 23→1, 24→2, 25→3
  const dayPlaces = PLACES.filter(p => p.day === day);

  let closest = null;
  for (let i = 0; i < dayPlaces.length; i++) {
    const t = dayPlaces[i].time.split('~')[0].split(':');
    const ph = parseInt(t[0]), pm = parseInt(t[1] || 0);
    if (h > ph || (h === ph && min >= pm)) {
      closest = dayPlaces[i].id;
    }
  }
  return closest;
}

function renderTimeline(days) {
  const container = document.getElementById('timeline');
  const nowId = getNowId();
  let html = '';

  days.forEach(day => {
    html += `<div class="day-divider day${day}">
      <div class="day-divider-dot"></div>
      <div class="day-divider-text">${DAY_LABELS[day]}</div>
      <div class="day-divider-line"></div>
    </div>`;

    const dayPlaces = PLACES.filter(p => p.day === day);
    dayPlaces.forEach(p => {
      const isNow = p.id === nowId;
      let extra = '';

      // Hours display
      if (p.hours) {
        extra += `<div class="tl-hours">🕐 ${p.hours}</div>`;
      }

      // Closed day warning
      if (p.closedDay !== undefined) {
        const dayNames = ['일','월','화','수','목','금','토'];
        const tripDate = new Date(2026, 4, 22 + day); // day1=23, day2=24, day3=25
        if (tripDate.getDay() === p.closedDay) {
          extra += `<div class="tl-closed-warn">⚠️ 이 날 ${dayNames[p.closedDay]}요일 휴무!</div>`;
        } else {
          extra += `<div class="tl-hours" style="color:#999">매주 ${dayNames[p.closedDay]} 휴무</div>`;
        }
      }
      // Also check alts for closedDay
      if (p.alts) {
        p.alts.forEach(a => {
          if (a.closedDay !== undefined) {
            const tripDate = new Date(2026, 4, 22 + day);
            if (tripDate.getDay() === a.closedDay) {
              a._closed = true;
            }
          }
        });
      }

      if (p.tip) {
        extra += `<div class="tl-tip">💡 ${p.tip}</div>`;
      }

      // PlanB (rain alternatives)
      if (p.planB && p.planB.length) {
        extra += `<div class="tl-planb-label">🌧️ 비 올 때 플랜B</div><div class="tl-planb">`;
        p.planB.forEach(b => {
          extra += `<span class="tl-planb-chip" onclick="event.stopPropagation(); map.setView([${b.lat},${b.lng}],14)" title="${b.desc}">${b.name}</span>`;
        });
        extra += `</div>`;
      }

      if (p.alts && p.alts.length) {
        extra += `<div class="tl-alts-label">🍽️ 추천 맛집 / 대안</div><div class="tl-alts">`;
        p.alts.forEach(a => {
          const closedTag = a._closed ? ' ⚠️휴무' : '';
          extra += `<a class="tl-alt-chip" href="${a.url}" target="_blank" onclick="event.stopPropagation()" title="${a.desc}"${a._closed ? ' style="opacity:0.5;text-decoration:line-through"' : ''}>${a.name}${closedTag}</a>`;
        });
        extra += `</div>`;
      }

      if (p.links && p.links.length) {
        extra += `<div class="tl-links-label">🔗 참고 링크</div><div class="tl-links">`;
        p.links.forEach(l => {
          extra += `<a class="tl-link" href="${l.url}" target="_blank" onclick="event.stopPropagation()">${l.label}</a>`;
        });
        extra += `</div>`;
      }

      // Navigation buttons (Naver Map + Kakao Map)
      const naverWeb = `https://map.naver.com/v5/search/${encodeURIComponent(p.name + ' 제주')}`;
      const kakaoUrl = `https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${p.lat},${p.lng}`;
      extra += `<div class="tl-nav-row">
        <a class="tl-nav-btn tl-nav-naver" href="${naverWeb}" target="_blank" onclick="event.stopPropagation()">🧭 네이버지도</a>
        <a class="tl-nav-btn tl-nav-kakao" href="${kakaoUrl}" target="_blank" onclick="event.stopPropagation()">🗺️ 카카오맵</a>
      </div>`;

      const hasPlanbAttr = p.planB && p.planB.length ? 'true' : 'false';
      html += `<div class="tl-card day${day} ${isNow ? 'is-now' : ''}" data-id="${p.id}" data-indoor="${p.indoor}" data-has-planb="${hasPlanbAttr}">
        <div class="tl-icon">${p.icon}</div>
        <div class="tl-content">
          <div class="tl-time">${p.time}</div>
          <div class="tl-name">${p.name}${p.indoor === false ? ' <span style="font-size:10px;color:#999">실외</span>' : ''}</div>
          <div class="tl-memo">${p.memo}</div>
          ${extra}
        </div>
        <div class="tl-num">${p.num}</div>
      </div>`;
    });

    // Ferry info for Day 2
    if (day === 2) {
      html += `<div class="ferry-info">
        <strong>⛴️ 가파도 배편</strong><br>
        운진항→가파도: 09:00 / <strong>10:00</strong> / 11:00 / 12:00 / 14:00 / 15:00 / 15:50<br>
        가파도→운진항: 11:20 / 12:20 / <strong>14:20</strong> / 14:50 / 15:20 / 15:50 / 16:10<br>
        왕복 ~10,000원 · 5월 청보리축제 증편 가능 · 결항 시 전날 확인
      </div>`;
    }
  });

  container.innerHTML = html;

  // Attach click handlers
  container.querySelectorAll('.tl-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      focusPlace(id);
    });
  });

  // Scroll to now
  if (nowId) {
    setTimeout(() => {
      const nowCard = container.querySelector('.is-now');
      if (nowCard) nowCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

// ─── FOCUS PLACE ──────────────────────────────
let activeCardId = null;

function focusPlace(id) {
  const place = PLACES.find(p => p.id === id);
  if (!place) return;

  // Pan map
  map.setView([place.lat, place.lng], 14, { animate: true, duration: 0.5 });

  // Open popup
  if (markers[id]) markers[id].openPopup();

  // Highlight marker
  document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('active-marker'));
  const markerEl = markers[id]?.getElement();
  if (markerEl) {
    const inner = markerEl.querySelector('.custom-marker');
    if (inner) inner.classList.add('active-marker');
  }

  // Highlight card
  document.querySelectorAll('.tl-card').forEach(c => c.classList.remove('active-card'));
  const card = document.querySelector(`.tl-card[data-id="${id}"]`);
  if (card) {
    card.classList.add('active-card');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  activeCardId = id;
}

// ─── TABS ─────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  showDay(tab.dataset.day);
});

// ─── RESIZE HANDLE (mobile) ──────────────────
const resizeHandle = document.getElementById('resizeHandle');
const mapContainer = document.querySelector('.map-container');
let isResizing = false;
let startY, startHeight;

function onResizeStart(e) {
  if (window.innerWidth >= 768) return;
  isResizing = true;
  startY = e.touches ? e.touches[0].clientY : e.clientY;
  startHeight = mapContainer.offsetHeight;
  document.body.style.userSelect = 'none';
}

function onResizeMove(e) {
  if (!isResizing) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const diff = y - startY;
  const newHeight = Math.max(150, Math.min(window.innerHeight * 0.8, startHeight + diff));
  mapContainer.style.flex = `0 0 ${newHeight}px`;
  map.invalidateSize();
}

function onResizeEnd() {
  isResizing = false;
  document.body.style.userSelect = '';
}

resizeHandle.addEventListener('mousedown', onResizeStart);
resizeHandle.addEventListener('touchstart', onResizeStart, { passive: true });
document.addEventListener('mousemove', onResizeMove);
document.addEventListener('touchmove', onResizeMove, { passive: true });
document.addEventListener('mouseup', onResizeEnd);
document.addEventListener('touchend', onResizeEnd);

// ─── CHECKLIST ────────────────────────────────
const checklistBtn = document.getElementById('checklistBtn');
const checklistDrawer = document.getElementById('checklistDrawer');
const checklistOverlay = document.getElementById('checklistOverlay');
const checklistItems = document.getElementById('checklistItems');

// Load state from localStorage
const savedChecks = JSON.parse(localStorage.getItem('jeju-checklist') || '{}');

let checkHtml = '';
CHECKLIST.forEach((item, i) => {
  const checked = savedChecks[i] || false;
  checkHtml += `<div class="check-item ${checked ? 'checked' : ''}">
    <input type="checkbox" id="chk${i}" ${checked ? 'checked' : ''}>
    <label for="chk${i}">${item}</label>
  </div>`;
});
checklistItems.innerHTML = checkHtml;

checklistItems.addEventListener('change', e => {
  if (e.target.type === 'checkbox') {
    const idx = parseInt(e.target.id.replace('chk', ''));
    const item = e.target.closest('.check-item');
    item.classList.toggle('checked', e.target.checked);
    savedChecks[idx] = e.target.checked;
    localStorage.setItem('jeju-checklist', JSON.stringify(savedChecks));
  }
});

function toggleChecklist() {
  const isOpen = checklistDrawer.classList.contains('open');
  checklistDrawer.classList.toggle('open');
  checklistOverlay.classList.toggle('open');
}

checklistBtn.addEventListener('click', toggleChecklist);
checklistOverlay.addEventListener('click', toggleChecklist);

// ─── RAIN MODE ───────────────────────────────
const rainBtn = document.getElementById('rainBtn');
rainBtn.addEventListener('click', () => {
  document.body.classList.toggle('rain-mode');
  rainBtn.classList.toggle('active');
});

// ─── INIT ─────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
    showDay('all');
    map.invalidateSize();
  }, 600);
});

// Handle resize
window.addEventListener('resize', () => {
  map.invalidateSize();
});

// ─── PWA: Service Worker Registration ────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(reg => console.log('SW registered:', reg.scope))
    .catch(err => console.log('SW registration failed:', err));
}
</script>
